<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSAK Gaming Links</title>
<meta name="description" content="Every RSAK Gaming channel in one place: YouTube, Instagram, TikTok and Facebook.">
<meta property="og:title" content="RSAK Gaming">
<meta property="og:description" content="Daily GTA 6 news, comparisons, countdowns and gaming memes.">
<meta property="og:image" content="assets/banner.jpg">
<meta name="theme-color" content="#070912">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070912; --panel: #10152a; --line: rgba(120, 200, 255, 0.16); --text: #e9eefb; --muted: #9aa6c4;
    --pink: #ff5ca8; --orange: #ff963c; --violet: #9b5cff; --cyan: #2fe0ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-family: Inter, system-ui, sans-serif;
    background: var(--bg) radial-gradient(1200px 600px at 50% -10%, rgba(255, 92, 168, 0.35), transparent 60%),
                radial-gradient(900px 500px at 100% 100%, rgba(155, 92, 255, 0.28), transparent 60%);
    display: flex; justify-content: center; padding: 48px 16px 40px;
  }
  main { width: 100%; max-width: 460px; text-align: center; }
  .logo { width: 108px; height: 108px; border-radius: 50%; object-fit: cover;
          box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--pink), 0 10px 40px rgba(255, 92, 168, 0.45); }
  h1 { font-family: Rajdhani, Inter, sans-serif; font-size: 34px; letter-spacing: 1px; margin: 18px 0 6px;
       background: linear-gradient(90deg, var(--pink), var(--orange)); -webkit-background-clip: text;
       background-clip: text; color: transparent; }
  .tag { color: var(--muted); margin: 0 0 28px; line-height: 1.5; font-size: 15px; }
  .count { display: inline-block; margin-bottom: 26px; padding: 8px 16px; border-radius: 999px; font-weight: 700;
           font-size: 14px; background: linear-gradient(90deg, var(--violet), var(--cyan)); color: #fff; }
  a.link { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text);
           background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 15px 18px;
           margin-bottom: 12px; transition: transform .15s ease, border-color .15s ease; }
  a.link:hover, a.link:focus-visible { transform: translateY(-2px); border-color: var(--pink); outline: none; }
  .ico { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; color: #fff; }
  .ico svg { width: 22px; height: 22px; }
  .youtube .ico { background: #ff1f3d; } .instagram .ico { background: linear-gradient(45deg, #ff963c, #ff3d7f, #9b5cff); }
  .tiktok .ico { background: #111; box-shadow: inset 2px 0 0 #2fe0ff, inset -2px 0 0 #ff3d7f; }
  .facebook .ico { background: #1877f2; } .x .ico { background: #000; } .default .ico { background: var(--violet); }
  .txt { text-align: left; flex: 1; min-width: 0; }
  .txt b { display: block; font-size: 16px; } .txt span { color: var(--muted); font-size: 14px; }
  .arrow { color: var(--muted); font-size: 20px; }
  footer { margin-top: 26px; font-size: 13px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo.jpg" alt="RSAK Gaming logo">
  <h1 id="name">RSAK GAMING</h1>
  <p class="tag" id="tagline">Daily GTA 6 news, comparisons, countdowns and gaming memes</p>
  <div class="count" id="count"></div>
  <nav id="links" aria-label="RSAK Gaming channels"></nav>
  <footer><a href="/">Website</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
</main>
<script>
  const ICONS = {
    youtube: '<path fill="currentColor" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15.1V8.9l5.8 3.1-5.8 3.1z"/>',
    instagram: '<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>',
    tiktok: '<path fill="currentColor" d="M16.6 2h-3.4v13.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9.1a6.4 6.4 0 1 0 5.4 6.3V8.6a8.1 8.1 0 0 0 4.8 1.6V6.8a4.8 4.8 0 0 1-4.8-4.8z"/>',
    facebook: '<path fill="currentColor" d="M14 8.5V6.8c0-.8.5-1 1-1h2.4V2.1L14.1 2C10.8 2 10 4.5 10 6.1v2.4H7.6v3.8H10V22h4v-9.7h3.1l.4-3.8H14z"/>',
    x: '<path fill="currentColor" d="M17.8 2h3.4l-7.4 8.5L22.5 22h-6.8l-5.3-7-6.1 7H.9l7.9-9L.5 2h7l4.8 6.4L17.8 2zm-1.2 18h1.9L7.5 4H5.5l11.1 16z"/>',
    default: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" fill="none" stroke="currentColor" stroke-width="2"/>'
  };
  const FALLBACK = {links: [
    {label: "YouTube", handle: "@RSAKGAMING", url: "https://www.youtube.com/@RSAKGAMING", icon: "youtube"},
    {label: "Instagram", handle: "@rsakgaming", url: "https://www.instagram.com/rsakgaming/", icon: "instagram"},
    {label: "TikTok", handle: "@rsak_gaming", url: "https://www.tiktok.com/@rsak_gaming", icon: "tiktok"},
    {label: "Facebook", handle: "RSAK Gaming", url: "https://www.facebook.com/profile.php?id=61595927129527", icon: "facebook"}
  ]};
  function esc(t) { const d = document.createElement("div"); d.textContent = t || ""; return d.innerHTML; }
  function render(data) {
    if (data.tagline) document.getElementById("tagline").textContent = data.tagline;
    document.getElementById("links").innerHTML = data.links.map(l => {
      const icon = ICONS[l.icon] ? l.icon : "default";
      return `<a class="link ${icon}" href="${encodeURI(l.url)}" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[icon]}</svg></span>
        <span class="txt"><b>${esc(l.label)}</b><span>${esc(l.handle)}</span></span><span class="arrow">›</span></a>`;
    }).join("");
  }
  const days = Math.ceil((Date.UTC(2026, 10, 19) - Date.now()) / 86400000);
  document.getElementById("count").textContent =
    days > 1 ? `🔥 ${days} days until GTA 6` : days === 1 ? "🔥 GTA 6 is out tomorrow" : "🎮 GTA 6 is out now";
  render(FALLBACK);
  fetch("links.json", {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(d => d && d.links && render(d)).catch(() => {});
</script>
</body>
</html>
